on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

name: Rust CI

jobs:
  rust_ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-build-target-

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install required packages
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update;sudo apt install libasound2-dev

      - name: Install required packages
        if: matrix.os == 'windows-latest'
        run: choco install ninja

      - run: cargo fmt --all -- --check
      # chunks_exact_to_as_chunks is a style lint newer clippy adds; it flags
      # chunks_exact(CONST) all over the existing code, which as_chunks would
      # only rewrite, not fix. Allowed so a toolchain bump does not turn the
      # whole tree red on an equivalent idiom.
      - run: cargo clippy --all -- -D warnings -A clippy::chunks_exact_to_as_chunks
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings -A clippy::chunks_exact_to_as_chunks

      - if: matrix.os == 'windows-latest'
        run: |
          $env:RUST_MIN_STACK=4194304
          cargo test --all

      - if: matrix.os != 'windows-latest'
        run: |
          export RUST_MIN_STACK=4194304
          cargo test --all
