[workspace]
resolver = "2"

members = [
    "wie_android",
    "wie_ios",
    "wie_portmaster",
    "wie_backend",
    "wie_brew",
    "wie_cli",
    "wie_util",
    "wie_core_arm",
    "wie_jvm_support",
    "wie_wipi_java",
    "wie_wipi_c",
    "wie_j2me",
    "wie_ktf",
    "wie_ktf_dump",
    "wie_lgt",
    "wie_skt",
    "wie_midi",
]

# Vendored third-party crates: dependencies, not our code, so they are kept out
# of the workspace's formatting and lint passes and left in their own style.
exclude = [
    "third_party/smaf",
    "third_party/smaf_player",
    "third_party/rustjava",
]

default-members = ["wie_cli"]

[profile.dev.package.wie_core_arm]
opt-level = 1

[profile.dev.package.arm32_cpu]
opt-level = 1

[profile.release]
lto = true

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = { version = "^1.0" }
libc = { version = "^0.2" }
async-recursion = { version = "^1.1", default-features = false }
async-trait = { version = "^0.1", default-features = false }
bitflags = { version = "^2.13", default-features = false }
bytemuck = { version = "^1.25", default-features = false, features = ["derive"] }
clap = { version = "^4.6", features = ["derive"] }
dyn-clone = { version = "^1.0", default-features = false }
futures = { version = "^0.3", default-features = false, features = ["alloc"] }
md5 = { version = "^0.8", default-features = false }
polling = { version = "^3.11" }
spin = { version = "^0.12", features = ["spin_mutex", "rwlock"], default-features = false }
tracing = { version = "^0.1", default-features = false, features = ["attributes"] }

# RustJava (a JVM in Rust), vendored from jjongjjongs/RustJava@b3cb0ab - itself a
# fork of dlunch/RustJava - so fixes to the JVM land with the emulator that needs
# them. Changes made here since the copy are listed in third_party/rustjava/VENDORED.md.
java_class_proto = { path = "third_party/rustjava/java_class_proto" }
java_constants = { path = "third_party/rustjava/java_constants" }
java_runtime = { path = "third_party/rustjava/java_runtime" }
jvm = { path = "third_party/rustjava/jvm" }
jvm_rust = { path = "third_party/rustjava/jvm_rust" }
wipi_types = { git = "https://github.com/dlunch/wipi.git" }

wie_backend = { path = "wie_backend" }
wie_midp = { path = "wie_midp" }
wie_util = { path = "wie_util" }
wie_core_arm = { path = "wie_core_arm" }
wie_jvm_support = { path = "wie_jvm_support" }
wie_skvm = { path = "wie_skvm" }
wie_wipi_c = { path = "wie_wipi_c" }
wie_wipi_java = { path = "wie_wipi_java" }

# dev-dependencies
futures-test = { version = "^0.3" }

test_utils = { path = "test_utils" }
