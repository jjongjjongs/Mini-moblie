[package]
name = "wie_core_arm"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Have the block engine (JitEngine) compile its blocks to native x86-64 /
# AArch64. Without it - or on any other host - the engine runs the decoded
# blocks itself. Correctness is pinned by differential tests against the
# interpreter in `engine::jit`.
jit = ["dep:dynasmrt"]

[dependencies]
async-trait = { workspace = true }
bytemuck = { workspace = true }
md5 = { workspace = true }
serde = { version = "^1", default-features = false, features = ["derive", "alloc"] }
spin = { workspace = true }
toml = { version = "^1", default-features = false, features = ["parse", "serde"] }
tracing = { workspace = true }

arm32_cpu = { path = "../third_party/arm32_cpu" }

wie_backend = { workspace = true }
wie_util = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gdbstub = { version = "^0.7" }
gdbstub_arch = { version = "^0.3" }
crossbeam = { version = "^0.8" }

# Runtime assembler for the machine-code JIT. Only pulled in on architectures it
# can emit for; the `jit` feature/module are gated to the same set.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
dynasmrt = { version = "^5", optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
futures-test = { workspace = true }
test_utils = { workspace = true }
